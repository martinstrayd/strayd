    <script type="text/babel">
      const { useState, useEffect, useRef, useCallback } = React;

      function useTypewriter(text, speed = 6, startDelay = 1900) {
        const [displayed, setDisplayed] = useState('');
        const [done, setDone] = useState(false);

        useEffect(() => {
          let index = 0;
          let timer = null;
          let delayTimer = setTimeout(() => {
            timer = setInterval(() => {
              index += 1;
              setDisplayed(text.slice(0, index));
              if (index >= text.length) {
                setDone(true);
                clearInterval(timer);
              }
            }, speed);
          }, startDelay);

          return () => {
            clearTimeout(delayTimer);
            if (timer) clearInterval(timer);
          };
        }, [text, speed, startDelay]);

        return { displayed, done };
      }

      const DEFAULT_VIDEO_URL =
        'hero-video.mp4';

      function App() {
        const videoRef = useRef(null);
        const targetTimeRef = useRef(0);
        const isSeekingRef = useRef(false);
        const prevXRef = useRef(null);
        const fileInputRef = useRef(null);

        const [menuOpen, setMenuOpen] = useState(false);
        const [pillsVisible, setPillsVisible] = useState(false);
        const [toastMessage, setToastMessage] = useState(null);
        const [activeModal, setActiveModal] = useState(null);
        const [pitchFormSubmitted, setPitchFormSubmitted] = useState(false);
        const [videoSrc, setVideoSrc] = useState(DEFAULT_VIDEO_URL);
        const [showVideoModal, setShowVideoModal] = useState(false);
        const [videoUrlInput, setVideoUrlInput] = useState('');
        const [isDragging, setIsDragging] = useState(false);

        const typewriterText =
          'Before launching his solo career, Martin Strayd worked extensively behind the music industry scenes as a celebrity Hollywood guitar technician for rock icons such as Steve Jones of the Sex Pistols and Doug Fieger of The Knack. \n\nHe now channels 55 years of experiences into hit singles and soundtracks for international radio stations,  centered around lifestyle themes, and the endless search for love.';
        const { displayed, done } = useTypewriter(typewriterText, 9, 40);

        useEffect(() => {
          const timer = setTimeout(() => setPillsVisible(true), 800);
          return () => clearTimeout(timer);
        }, []);

        const handleSeeked = useCallback(() => {
          const video = videoRef.current;
          if (!video) return;
          const target = targetTimeRef.current;
          if (Math.abs(video.currentTime - target) > 0.03) {
            video.currentTime = target;
          } else {
            isSeekingRef.current = false;
          }
        }, []);

        useEffect(() => {
          const handleMouseMove = (e) => {
            const video = videoRef.current;
            if (!video || !video.duration || Number.isNaN(video.duration)) {
              prevXRef.current = e.clientX;
              return;
            }
            if (prevXRef.current === null) {
              prevXRef.current = e.clientX;
              return;
            }
            const currentX = e.clientX;
            const delta = currentX - prevXRef.current;
            prevXRef.current = currentX;

            const SENSITIVITY = 0.8;
            const timeOffset = (delta / window.innerWidth) * SENSITIVITY * video.duration;
            let newTarget = targetTimeRef.current + timeOffset;
            if (newTarget < 0) newTarget = 0;
            if (newTarget > video.duration) newTarget = video.duration;
            targetTimeRef.current = newTarget;

            if (!isSeekingRef.current) {
              isSeekingRef.current = true;
              video.currentTime = newTarget;
            }
          };

          const handleMouseLeave = () => { prevXRef.current = null; };

          window.addEventListener('mousemove', handleMouseMove, { passive: true });
          window.addEventListener('mouseleave', handleMouseLeave);
          return () => {
            window.removeEventListener('mousemove', handleMouseMove);
            window.removeEventListener('mouseleave', handleMouseLeave);
          };
        }, []);

        // Drag & drop support for any video file
        useEffect(() => {
          const handleDragOver = (e) => {
            e.preventDefault();
            if (e.dataTransfer?.types?.includes('Files')) setIsDragging(true);
          };
          const handleDragLeave = (e) => {
            if (e.clientX <= 0 || e.clientY <= 0 || e.clientX >= window.innerWidth || e.clientY >= window.innerHeight) {
              setIsDragging(false);
            }
          };
          const handleDrop = (e) => {
            e.preventDefault();
            setIsDragging(false);
            const file = e.dataTransfer?.files?.[0];
            if (file && file.type.startsWith('video/')) {
              setVideoSrc(URL.createObjectURL(file));
              setToastMessage('Background video updated from file');
              setTimeout(() => setToastMessage(null), 2500);
            }
          };
          window.addEventListener('dragover', handleDragOver);
          window.addEventListener('dragleave', handleDragLeave);
          window.addEventListener('drop', handleDrop);
          return () => {
            window.removeEventListener('dragover', handleDragOver);
            window.removeEventListener('dragleave', handleDragLeave);
            window.removeEventListener('drop', handleDrop);
          };
        }, []);

        const handleLoadedMetadata = () => {
          if (videoRef.current) {
            targetTimeRef.current = videoRef.current.currentTime || 0;
            videoRef.current.currentTime = 0.01;
          }
        };

        const handleCopyEmail = (e) => {

            navigator.clipboard.writeText(emailToCopy);

          setTimeout(() => setToastMessage(null), 2400);
        };

        const handleFileInputChange = (e) => {

            setTimeout(() => setToastMessage(null), 2500);

            setShowVideoModal(false);
            setToastMessage('Background video URL applied');
            setTimeout(() => setToastMessage(null), 2500);

              className="hidden"

                <p className="text-xs text-neutral-400">Something cool happens</p>
              </div>
            )}

            <video

              key={videoSrc}

              muted

              preload="auto"
              onSeeked={handleSeeked}
              onLoadedMetadata={handleLoadedMetadata}

              style={{ objectFit: 'cover', objectPosition: '70% center' }}

            <div className="fixed inset-0 z-0 bg-gradient-to-r from-black/55 via-black/30 to-black/40 pointer-events-none" />

                  <button type="button" onClick={() => setActiveModal(null)} className="w-full bg-white text-black font-medium text-sm py-2 rounded-full">Close</button>
                </div>
              </div>
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>

 
  </body>
</html>
